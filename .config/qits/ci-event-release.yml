event: SCMRelease
when:
  - repository: { exact: qits-userflows-javalib }
artifacts:
  - { type: maven, name: "eu.wohlben.qits:qits-userflows" }
steps:
  - image: qits/build-images/userflows-base:latest
    timeout-seconds: 1800
    script: |
      set -eu
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"
      if curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-userflows/$version/qits-userflows-$version.pom"; then
        echo "qits-userflows@$version is already published — skipping"
        exit 0
      fi
      mvn -B -ntp deploy -DskipTests \
        -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"
